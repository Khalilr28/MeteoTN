name: CI/CD - meteotn

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/meteotn:latest
    steps:
      # Checkout the code (full history for Gitleaks)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gitleaks scan (before compilation)
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload the Gitleaks report (even if the scan fails)
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore
      
            # Hadolint: lint the Dockerfile (results go to the Security tab)
      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true

      - name: Upload Hadolint results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint

      # Install Java
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Compile Java code
      - name: Compile Java
        run: mvn -B compile

      # Build with Maven (also runs the unit tests)
      - name: Build Java project with Maven
        run: mvn -B clean package

      # Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker image
      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE_NAME .

      # Test Docker image locally
      - name: Test Docker image locally
        run: |
          docker run -d --name meteotn-test -p 8080:8080 $DOCKER_IMAGE_NAME
          sleep 15
          curl -f http://localhost:8080
          docker stop meteotn-test
          docker rm meteotn-test

      # Trivy: readable table in the logs
      - name: Scan Docker image with Trivy (table)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      # Trivy: SARIF results for the GitHub Security tab
      - name: Scan Docker image with Trivy (SARIF)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # Trivy: JSON report + fail the pipeline on CRITICAL/HIGH
      - name: Scan Docker image with Trivy (gate)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      # Upload the Trivy report (even if the scan fails)
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: ignore

      # Push Docker image (only if everything above passed)
      - name: Push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker push $DOCKER_IMAGE_NAME

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-java