<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Météo Tunisie</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛅</text></svg>">
<link rel="stylesheet" href="/style.css">
<body data-theme="cloud">
<div class="blob b1"></div>
<div class="blob b2"></div>

<main class="wrap">
  <header>
    <div>
      <p class="eyebrow">الطقس في تونس</p>
      <h1>Météo <span>Tunisie</span></h1>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <nav class="chips" id="cities" aria-label="Cities"></nav>

  <section class="grid">
    <article class="glass hero loading" id="hero">
      <div>
        <div class="city" id="city">Loading...</div>
        <div class="temp"><span id="temp">--</span><small>°C</small></div>
        <div class="desc" id="desc">&nbsp;</div>
      </div>
      <div class="icon" id="icon">⏳</div>
    </article>

    <div class="stats loading" id="stats">
      <div class="glass tile"><span class="label">Feels like</span><span class="value" id="feels">--</span></div>
      <div class="glass tile"><span class="label">Humidity</span><span class="value" id="hum">--</span></div>
      <div class="glass tile"><span class="label">Wind</span><span class="value" id="wind">--</span></div>
    </div>
  </section>

  <section class="forecast" id="forecast"></section>
  <div class="error" id="error">Could not load the weather. Please try again.</div>
  <footer>Data by Open-Meteo · DevSecOps project</footer>
</main>
<script src="/app.js" defer></script>
</html>
